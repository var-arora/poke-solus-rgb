name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout rgbds
        uses: actions/checkout@master
        with:
          path: rgbds
          ref: v0.8.0
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo make install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(nproc) compare
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            return 1
          fi

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(nproc)
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            return 1
          fi

      - name: Test critical-hit rates
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          python3 -m venv /tmp/solus-critical-hit-tests
          /tmp/solus-critical-hit-tests/bin/pip install -r tests/requirements.txt
          /tmp/solus-critical-hit-tests/bin/python tests/critical_hits.py pokesolusred.gbc pokesolusgreen.gbc pokesolusblue.gbc

      - name: Checkout original Solus 1.5 source
        if: ${{ github.repository_owner != 'pret' }}
        uses: actions/checkout@master
        with:
          repository: Dechrissen/poke-solus-rgb
          ref: 95e157191e920162a24908cc95c358e73d294689
          path: solus-1.5-original

      - name: Test save compatibility
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -C solus-1.5-original -j$(nproc) red blue green
          /tmp/solus-critical-hit-tests/bin/python tests/save_compatibility.py --original-dir solus-1.5-original

      - name: Test effectiveness reporting and unchanged damage
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          /tmp/solus-critical-hit-tests/bin/python tests/type_effectiveness.py --original-dir solus-1.5-original

      - name: Test automatic box changes and capture saves
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          /tmp/solus-critical-hit-tests/bin/python tests/auto_box.py --original-dir solus-1.5-original

      - name: Checkout and build the earlier automatic-box version
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          mkdir solus-auto-box-original
          git fetch origin 4d2fe7731a8f814e2cbb3926c6b0aa9e9632a16f
          git archive 4d2fe7731a8f814e2cbb3926c6b0aa9e9632a16f | tar -x -C solus-auto-box-original
          make -C solus-auto-box-original -j$(nproc) red blue green

      - name: Test the larger bag and old-save import
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          mkdir solus-60-slot-original
          git fetch origin eae0eb4eb0857f8f94da3dba9473b10ef1852177
          git archive eae0eb4eb0857f8f94da3dba9473b10ef1852177 | tar -x -C solus-60-slot-original
          make -C solus-60-slot-original -j$(nproc) red blue green
          /tmp/solus-critical-hit-tests/bin/python tests/expanded_bag.py --original-dir solus-1.5-original --previous-dir solus-auto-box-original --larger-bag-dir solus-60-slot-original

      - name: Discord webhook
        if: ${{ github.event_name == 'push' && github.repository_owner == 'pret' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          .github/webhook.sh

      - name: Checkout symbols
        if: ${{ github.event_name == 'push' && github.repository_owner == 'pret' }}
        uses: actions/checkout@master
        with:
          path: symbols
          ref: symbols

      - name: Move symbols
        if: ${{ github.event_name == 'push' && github.repository_owner == 'pret' }}
        run: |
          cp -v *.sym symbols/
          cp -v *.map symbols/

      - name: Update symbols
        if: ${{ github.event_name == 'push' && github.repository_owner == 'pret' }}
        uses: EndBug/add-and-commit@v9
        with:
          cwd: "./symbols"
          add: "*.sym *.map"
          message: ${{ github.event.commits[0].message }}
